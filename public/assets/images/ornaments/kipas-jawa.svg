<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <linearGradient id="fanGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5C8" />
      <stop offset="50%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#8C6826" />
    </linearGradient>
  </defs>

  <!-- Kipas Tradisional Jawa (Keputren) -->
  <!-- Fan Base Pivot -->
  <circle cx="150" cy="180" r="10" fill="url(#fanGold)" stroke="#2F1B14" stroke-width="2" />
  <circle cx="150" cy="180" r="4" fill="#2F1B14" />

  <!-- Fan Ribs & Blades -->
  <path d="M 150,180 L 30,80 A 150,150 0 0,1 270,80 Z" fill="#4A2C20" stroke="url(#fanGold)" stroke-width="2" opacity="0.9" />

  <!-- Inner Arch Pattern -->
  <path d="M 150,180 L 60,110 A 110,110 0 0,1 240,110 Z" fill="#2F1B14" stroke="url(#fanGold)" stroke-width="1.5" />

  <!-- Intricate Rib Lines radiating from center -->
  <line x1="150" y1="180" x2="30" y2="80" stroke="url(#fanGold)" stroke-width="2" />
  <line x1="150" y1="180" x2="60" y2="55" stroke="url(#fanGold)" stroke-width="1.5" />
  <line x1="150" y1="180" x2="95" y2="38" stroke="url(#fanGold)" stroke-width="1.5" />
  <line x1="150" y1="180" x2="135" y2="30" stroke="url(#fanGold)" stroke-width="1.5" />
  <line x1="150" y1="180" x2="165" y2="30" stroke="url(#fanGold)" stroke-width="1.5" />
  <line x1="150" y1="180" x2="205" y2="38" stroke="url(#fanGold)" stroke-width="1.5" />
  <line x1="150" y1="180" x2="240" y2="55" stroke="url(#fanGold)" stroke-width="1.5" />
  <line x1="150" y1="180" x2="270" y2="80" stroke="url(#fanGold)" stroke-width="2" />

  <!-- Scalloped Lace / Golden Rim Ornaments -->
  <path d="M 30,80 Q 45,65 60,55 Q 78,45 95,38 Q 115,32 135,30 Q 150,28 165,30 Q 185,32 205,38 Q 222,45 240,55 Q 255,65 270,80" 
        fill="none" stroke="url(#fanGold)" stroke-width="3" />

  <!-- Golden Dots at Tips -->
  <g fill="url(#fanGold)">
    <circle cx="30" cy="80" r="4" />
    <circle cx="60" cy="55" r="4" />
    <circle cx="95" cy="38" r="4" />
    <circle cx="135" cy="30" r="4" />
    <circle cx="165" cy="30" r="4" />
    <circle cx="205" cy="38" r="4" />
    <circle cx="240" cy="55" r="4" />
    <circle cx="270" cy="80" r="4" />
  </g>
</svg>
