<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 400" width="100%" height="100%">
  <defs>
    <linearGradient id="janurGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D38A" />
      <stop offset="50%" stop-color="#A2AB6E" />
      <stop offset="100%" stop-color="#677344" />
    </linearGradient>
    <linearGradient id="janurGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#8C6826" />
    </linearGradient>
  </defs>

  <!-- Janur Kuning / Kembar Mayang Hiasan Gantung -->
  <!-- Top Attachment Rope -->
  <rect x="70" y="0" width="10" height="30" fill="url(#janurGold)" rx="2" />
  <circle cx="75" cy="35" r="8" fill="url(#janurGold)" />

  <!-- Cascading Young Coconut Leaves (Anyaman Janur Tradisional) -->
  <!-- Leaf 1 Left & Right Pair -->
  <path d="M 75,40 C 40,60 10,90 20,130 C 35,110 60,80 75,60" fill="url(#janurGrad)" stroke="#535F33" stroke-width="1" />
  <path d="M 75,40 C 110,60 140,90 130,130 C 115,110 90,80 75,60" fill="url(#janurGrad)" stroke="#535F33" stroke-width="1" />

  <!-- Leaf 2 Pair -->
  <path d="M 75,70 C 35,95 5,130 15,175 C 32,150 60,115 75,95" fill="url(#janurGrad)" stroke="#535F33" stroke-width="1" />
  <path d="M 75,70 C 115,95 145,130 135,175 C 118,150 90,115 75,95" fill="url(#janurGrad)" stroke="#535F33" stroke-width="1" />

  <!-- Leaf 3 Pair -->
  <path d="M 75,110 C 30,140 10,180 22,225 C 38,195 62,155 75,135" fill="url(#janurGrad)" stroke="#535F33" stroke-width="1" />
  <path d="M 75,110 C 120,140 140,180 128,225 C 112,195 88,155 75,135" fill="url(#janurGrad)" stroke="#535F33" stroke-width="1" />

  <!-- Leaf 4 Pair -->
  <path d="M 75,150 C 35,185 18,230 30,275 C 45,240 65,200 75,180" fill="url(#janurGrad)" stroke="#535F33" stroke-width="1" />
  <path d="M 75,150 C 115,185 132,230 120,275 C 105,240 85,200 75,180" fill="url(#janurGrad)" stroke="#535F33" stroke-width="1" />

  <!-- Central Stem Backbone -->
  <line x1="75" y1="35" x2="75" y2="380" stroke="url(#janurGold)" stroke-width="3" stroke-linecap="round" />

  <!-- Cascading Tassel Tips -->
  <path d="M 75,250 C 60,290 55,340 58,385 C 65,345 70,300 75,270" fill="url(#janurGrad)" />
  <path d="M 75,250 C 90,290 95,340 92,385 C 85,345 80,300 75,270" fill="url(#janurGrad)" />
  <path d="M 75,280 L 75,395" stroke="url(#janurGrad)" stroke-width="2.5" />
</svg>
