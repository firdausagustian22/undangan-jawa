<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="100%" height="100%">
  <defs>
    <radialGradient id="jasminePetal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#E8E2D2" />
    </radialGradient>
    <linearGradient id="jasmineStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5B085" />
      <stop offset="100%" stop-color="#6F7C50" />
    </linearGradient>
    <linearGradient id="goldBead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7C4" />
      <stop offset="50%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#8C6826" />
    </linearGradient>
  </defs>

  <!-- Untaian Ronce Melati (Bunga Melati Pengantin Adat Jawa) -->

  <!-- Hanging Thread Line -->
  <line x1="100" y1="0" x2="100" y2="390" stroke="url(#jasmineStem)" stroke-width="2" />

  <!-- Cascading Melati Buds (Kuncup Melati) -->
  <!-- Level 1 (Top Garland) -->
  <g transform="translate(100, 30)">
    <circle cx="0" cy="0" r="5" fill="url(#goldBead)" />
    <!-- 5 Petals of Jasmine -->
    <ellipse cx="0" cy="-12" rx="6" ry="10" fill="url(#jasminePetal)" stroke="#D8D0BE" stroke-width="0.8" />
    <ellipse cx="11" cy="-4" rx="10" ry="6" fill="url(#jasminePetal)" stroke="#D8D0BE" stroke-width="0.8" />
    <ellipse cx="7" cy="10" rx="7" ry="10" fill="url(#jasminePetal)" stroke="#D8D0BE" stroke-width="0.8" />
    <ellipse cx="-7" cy="10" rx="7" ry="10" fill="url(#jasminePetal)" stroke="#D8D0BE" stroke-width="0.8" />
    <ellipse cx="-11" cy="-4" rx="10" ry="6" fill="url(#jasminePetal)" stroke="#D8D0BE" stroke-width="0.8" />
    <circle cx="0" cy="0" r="3" fill="#FFE885" />
  </g>

  <!-- Level 2 -->
  <g transform="translate(100, 90)">
    <circle cx="0" cy="0" r="5" fill="url(#goldBead)" />
    <ellipse cx="0" cy="-12" rx="6" ry="10" fill="url(#jasminePetal)" stroke="#D8D0BE" stroke-width="0.8" />
    <ellipse cx="11" cy="-4" rx="10" ry="6" fill="url(#jasminePetal)" stroke="#D8D0BE" stroke-width="0.8" />
    <ellipse cx="7" cy="10" rx="7" ry="10" fill="url(#jasminePetal)" stroke="#D8D0BE" stroke-width="0.8" />
    <ellipse cx="-7" cy="10" rx="7" ry="10" fill="url(#jasminePetal)" stroke="#D8D0BE" stroke-width="0.8" />
    <ellipse cx="-11" cy="-4" rx="10" ry="6" fill="url(#jasminePetal)" stroke="#D8D0BE" stroke-width="0.8" />
    <circle cx="0" cy="0" r="3" fill="#FFE885" />
  </g>

  <!-- Level 3 -->
  <g transform="translate(100, 155)">
    <circle cx="0" cy="0" r="5" fill="url(#goldBead)" />
    <ellipse cx="0" cy="-12" rx="6" ry="10" fill="url(#jasminePetal)" stroke="#D8D0BE" stroke-width="0.8" />
    <ellipse cx="11" cy="-4" rx="10" ry="6" fill="url(#jasminePetal)" stroke="#D8D0BE" stroke-width="0.8" />
    <ellipse cx="7" cy="10" rx="7" ry="10" fill="url(#jasminePetal)" stroke="#D8D0BE" stroke-width="0.8" />
    <ellipse cx="-7" cy="10" rx="7" ry="10" fill="url(#jasminePetal)" stroke="#D8D0BE" stroke-width="0.8" />
    <ellipse cx="-11" cy="-4" rx="10" ry="6" fill="url(#jasminePetal)" stroke="#D8D0BE" stroke-width="0.8" />
    <circle cx="0" cy="0" r="3" fill="#FFE885" />
  </g>

  <!-- Level 4 -->
  <g transform="translate(100, 220)">
    <circle cx="0" cy="0" r="5" fill="url(#goldBead)" />
    <ellipse cx="0" cy="-10" rx="5" ry="9" fill="url(#jasminePetal)" stroke="#D8D0BE" stroke-width="0.8" />
    <ellipse cx="10" cy="-3" rx="9" ry="5" fill="url(#jasminePetal)" stroke="#D8D0BE" stroke-width="0.8" />
    <ellipse cx="6" cy="9" rx="6" ry="9" fill="url(#jasminePetal)" stroke="#D8D0BE" stroke-width="0.8" />
    <ellipse cx="-6" cy="9" rx="6" ry="9" fill="url(#jasminePetal)" stroke="#D8D0BE" stroke-width="0.8" />
    <ellipse cx="-10" cy="-3" rx="9" ry="5" fill="url(#jasminePetal)" stroke="#D8D0BE" stroke-width="0.8" />
    <circle cx="0" cy="0" r="2.5" fill="#FFE885" />
  </g>

  <!-- Level 5 (Bottom Tassel / Kuncup Melati) -->
  <g transform="translate(100, 285)">
    <circle cx="0" cy="0" r="4" fill="url(#goldBead)" />
    <ellipse cx="0" cy="12" rx="5" ry="12" fill="url(#jasminePetal)" stroke="#D8D0BE" stroke-width="0.8" />
    <ellipse cx="-5" cy="8" rx="4" ry="10" fill="url(#jasminePetal)" stroke="#D8D0BE" stroke-width="0.8" />
    <ellipse cx="5" cy="8" rx="4" ry="10" fill="url(#jasminePetal)" stroke="#D8D0BE" stroke-width="0.8" />
  </g>

  <!-- Level 6 (End Tip) -->
  <g transform="translate(100, 345)">
    <ellipse cx="0" cy="10" rx="4" ry="10" fill="url(#jasminePetal)" stroke="#D8D0BE" stroke-width="0.8" />
    <circle cx="0" cy="24" r="3" fill="url(#goldBead)" />
  </g>
</svg>
