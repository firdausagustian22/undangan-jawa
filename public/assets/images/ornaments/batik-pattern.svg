<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="batikGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C6A15B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8C6826" stop-opacity="0.05" />
    </radialGradient>
  </defs>

  <!-- Batik Kawung & Parang Rusak Repeat Tile -->
  <!-- Background transparent -->

  <!-- Kawung 4-lobed Petals Motif Center -->
  <g stroke="#C6A15B" stroke-width="1.2" fill="none" opacity="0.35">
    <!-- Center Kawung -->
    <ellipse cx="60" cy="40" rx="14" ry="20" fill="url(#batikGold)" />
    <ellipse cx="60" cy="80" rx="14" ry="20" fill="url(#batikGold)" />
    <ellipse cx="40" cy="60" rx="20" ry="14" fill="url(#batikGold)" />
    <ellipse cx="80" cy="60" rx="20" ry="14" fill="url(#batikGold)" />
    <circle cx="60" cy="60" r="4" fill="#C6A15B" opacity="0.5" />

    <!-- Corner Kawung Repetitions -->
    <ellipse cx="0" cy="0" rx="14" ry="20" />
    <ellipse cx="0" cy="0" rx="20" ry="14" />
    <ellipse cx="120" cy="0" rx="14" ry="20" />
    <ellipse cx="120" cy="0" rx="20" ry="14" />
    <ellipse cx="0" cy="120" rx="14" ry="20" />
    <ellipse cx="0" cy="120" rx="20" ry="14" />
    <ellipse cx="120" cy="120" rx="14" ry="20" />
    <ellipse cx="120" cy="120" rx="20" ry="14" />
  </g>

  <!-- Parang Rusak Diagonal Sword Texture Lines -->
  <g stroke="#C6A15B" stroke-width="0.8" opacity="0.25">
    <line x1="0" y1="30" x2="30" y2="0" />
    <line x1="0" y1="90" x2="90" y2="0" />
    <line x1="30" y1="120" x2="120" y2="30" />
    <line x1="90" y1="120" x2="120" y2="90" />
  </g>

  <!-- Tiny Gold Filigree Accents -->
  <circle cx="60" cy="10" r="1.5" fill="#C6A15B" opacity="0.4" />
  <circle cx="60" cy="110" r="1.5" fill="#C6A15B" opacity="0.4" />
  <circle cx="10" cy="60" r="1.5" fill="#C6A15B" opacity="0.4" />
  <circle cx="110" cy="60" r="1.5" fill="#C6A15B" opacity="0.4" />
</svg>
