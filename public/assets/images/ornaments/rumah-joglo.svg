<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="jogloGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEDAA2" />
      <stop offset="50%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#8C6826" />
    </linearGradient>
    <linearGradient id="jogloWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A2C20" />
      <stop offset="100%" stop-color="#2F1B14" />
    </linearGradient>
  </defs>

  <!-- Arsitektur Rumah Joglo & Pendopo Jawa Klasik -->
  
  <!-- Base Foundation Platform (Umpak & Lantai Pendopo) -->
  <polygon points="50,330 550,330 520,310 80,310" fill="#2F1B14" stroke="url(#jogloGold)" stroke-width="2" />
  <rect x="80" y="300" width="440" height="10" fill="url(#jogloGold)" opacity="0.6" />

  <!-- Tiang Penyangga (Saka Guru & Saka Rawa) -->
  <!-- Outer Pillars -->
  <rect x="110" y="190" width="12" height="110" fill="url(#jogloWood)" stroke="url(#jogloGold)" stroke-width="1.5" />
  <rect x="180" y="185" width="12" height="115" fill="url(#jogloWood)" stroke="url(#jogloGold)" stroke-width="1.5" />
  <!-- Main Saka Guru (Central Grand Pillars) -->
  <rect x="250" y="150" width="16" height="150" fill="url(#jogloWood)" stroke="url(#jogloGold)" stroke-width="2" />
  <rect x="334" y="150" width="16" height="150" fill="url(#jogloWood)" stroke="url(#jogloGold)" stroke-width="2" />
  <!-- Outer Pillars Right -->
  <rect x="408" y="185" width="12" height="115" fill="url(#jogloWood)" stroke="url(#jogloGold)" stroke-width="1.5" />
  <rect x="478" y="190" width="12" height="110" fill="url(#jogloWood)" stroke="url(#jogloGold)" stroke-width="1.5" />

  <!-- Carved Wooden Beam (Blandar & Pengeret) -->
  <rect x="235" y="145" width="130" height="10" fill="url(#jogloGold)" rx="2" />
  <rect x="100" y="185" width="400" height="8" fill="url(#jogloGold)" rx="2" opacity="0.8" />

  <!-- Atap Utama Joglo (Brunjung - Puncak Piramida Bertingkat) -->
  <!-- Tingkat Puncak (Top Tier Roof) -->
  <polygon points="265,30 335,30 370,90 230,90" fill="url(#jogloWood)" stroke="url(#jogloGold)" stroke-width="2.5" />
  <line x1="260" y1="28" x2="340" y2="28" stroke="url(#jogloGold)" stroke-width="4" stroke-linecap="round" />
  <!-- Mahkota Puncak Molo -->
  <path d="M 285,28 L 300,10 L 315,28 Z" fill="url(#jogloGold)" />

  <!-- Tingkat Tengah (Middle Tier Roof) -->
  <polygon points="220,90 380,90 430,150 170,150" fill="url(#jogloWood)" stroke="url(#jogloGold)" stroke-width="2" />

  <!-- Atap Teritisan / Penanggap (Wide Sweeping Eaves) -->
  <polygon points="160,150 440,150 560,200 40,200" fill="url(#jogloWood)" stroke="url(#jogloGold)" stroke-width="2.5" />

  <!-- Decorative Carvings on Roof Eaves (Lisplang Ukir Jepara) -->
  <path d="M 40,200 Q 100,195 160,195 Q 300,190 440,195 Q 500,195 560,200" fill="none" stroke="url(#jogloGold)" stroke-width="3" />

  <!-- Ukiran Tumpang Sari (Ceiling Shadow Filigree) -->
  <g fill="none" stroke="url(#jogloGold)" stroke-width="1" opacity="0.7">
    <line x1="265" y1="160" x2="335" y2="160" />
    <line x1="275" y1="170" x2="325" y2="170" />
    <line x1="285" y1="180" x2="315" y2="180" />
  </g>
</svg>
